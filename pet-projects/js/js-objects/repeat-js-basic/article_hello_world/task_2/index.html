        1. читабельність, набагато простіше щоб джс код був в окремому файлі,

        3. якщо підключити файл js в атрибут <head>,
        то атрибут script блокує відображення html елементів доти,
        поки не завантажиться повністю файл js, тому прийнято розміщяти
        файл js в кінець атрибута <body>
