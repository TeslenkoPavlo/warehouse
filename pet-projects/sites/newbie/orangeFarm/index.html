<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">
    <div class="wrapper-grid">
        <div class="search-panel">
            <div class="wrapper-search-panel">
                <div class="main-menu-panel">
                    <div class="wrapper-main-menu-panel">
                        <img class="logo-orange-farm" src="png/logo-orange-farm.png" alt="">
                        <div class="menu-elements-panel">
                            <nav class="wrapper-menu-elements-panel">
                                <button>Search</button>
                                <ul>
                                    <li>
                                        <img src="png/icon-table.png" alt="">
                                        <a href="#">Dashboard</a>
                                    </li>
                                </ul>
                            </nav>
                        </div>
                    </div>
                </div>
                <div class="additional-menu-panel"></div>
            </div>
        </div>
        <div class="wrapper-rows">
            <div class="top-rows">
                <div class="revenues">Revenues</div>
                <div class="lost-deals">Lost deals</div>
                <div class="quarter-goal">Quarter goal</div>
            </div>
            <div class="middle-rows">
                <div>Customers</div>
                <div class="right-middle-rows">
                    <div>Growth</div>
                    <div class="right-middle-bottom-rows">
                        <div class="top-month">Top month</div>
                        <div class="top-year">Top year</div>
                        <div class="top-buyer">Top buyer</div>
                    </div>
                </div>
            </div>
            <div class="bottom-rows">
                <div class="chats">Chats</div>
                <div class="top-states">Top states</div>
                <div class="new-deals">new-deals</div>
